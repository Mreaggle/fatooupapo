name: Solicitar análise de vídeo
description: Envie um vídeo para a fila de checagem. Os pedidos e materiais são públicos.
title: '[Análise] '
body:
  - type: markdown
    attributes:
      value: |
        Primeiro, consulte os pedidos existentes para evitar duplicatas.
        O processamento começa após aprovação da equipe e depende das cotas de IA e da disponibilidade da transcrição. A publicação exige revisão e não tem prazo garantido.
  - type: input
    id: video
    attributes:
      label: Vídeo do YouTube
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: Duração em minutos
      description: Máximo de 240 minutos (4 horas). A equipe deve conferir a duração antes de aprovar.
      placeholder: '120'
    validations:
      required: true
  - type: input
    id: reference_date
    attributes:
      label: Data de referência
      description: Data da gravação ou publicação, no formato AAAA-MM-DD. A equipe deve confirmar esta data.
      placeholder: '2024-10-01'
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto e fontes sugeridas
      description: Explique o recorte desejado e indique fontes. Links sugeridos só serão usados após revisão; não inclua dados privados.
  - type: textarea
    id: transcript
    attributes:
      label: Legenda SRT ou VTT
      description: Opcional. Cole a legenda como texto. Para arquivos longos, a equipe pode adicionar requests/VIDEO_ID.srt ou .vtt ao repositório.
      render: text
  - type: checkboxes
    id: consent
    attributes:
      label: Publicação e uso do material
      options:
        - label: Entendo que o pedido é público e que os materiais fornecidos precisam estar autorizados para uso no projeto.
          required: true
