name: Validar integração Gemini

on:
  workflow_dispatch:
    inputs:
      check_search:
        description: Testar também Google Search (somente com cota disponível)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-gemini
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar JSON e busca opcional sem debitar créditos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CHECK_GEMINI_SEARCH: ${{ inputs.check_search }}
        run: node scripts/analysis/check-gemini.ts
