name: Processar pedido de análise

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Número do pedido (formulário de análise)
        required: true
        type: string
      operation:
        description: Retomar lote ou preparar publicação após revisão editorial
        required: true
        type: choice
        default: process
        options: [process, publish-reviewed]
      allow_transcript_fetch:
        description: Autorizo tentar obter a legenda deste vídeo por meio permitido
        type: boolean
        default: false
      review_confirmed:
        description: Conferi duração, data, áudio, inventário, omissões, duplicatas, conclusões e fontes originais
        type: boolean
        default: false

# Serializes all requests. Issues remain the durable queue, rather than runner time.
concurrency:
  group: analysis-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read

jobs:
  analyze:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Análise]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Selecionar pedido e validar autorização
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OPERATION: ${{ inputs.operation || 'process' }}
          REVIEW_CONFIRMED: ${{ inputs.review_confirmed }}
        run: node scripts/analysis/select-request.ts
      - name: Recuperar progresso da branch de análise
        if: steps.gate.outputs.ready == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        run: |
          branch="analysis/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --no-tags origin "$branch"
            git restore --source FETCH_HEAD -- drafts
          fi
      - name: Preparar legenda e pedido
        id: prepare
        if: steps.gate.outputs.ready == 'true'
        env:
          ALLOW_TRANSCRIPT_FETCH: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_transcript_fetch }}
        run: node scripts/analysis/execute.ts prepare
      - name: Verificar vídeo antes de extrair legenda ou consumir créditos
        if: steps.prepare.outcome == 'success'
        run: node scripts/analysis/execute.ts verify-video
      - uses: actions/setup-python@v5
        if: steps.prepare.outputs.needs_fetch == 'true' && steps.gate.outputs.operation == 'process'
        with:
          python-version: '3.12'
      - name: Obter legenda autorizada (tentativa única)
        id: transcript
        if: steps.prepare.outputs.needs_fetch == 'true' && steps.gate.outputs.operation == 'process'
        timeout-minutes: 3
        run: |
          python -m pip install -r scripts/analysis/requirements.txt
          python scripts/analysis/fetch-transcript.py
      - name: Verificar transcrição antes de consumir créditos
        if: success() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.operation == 'process'
        run: node scripts/analysis/execute.ts verify-video --transcript
      - name: Reservar orçamento global antes de chamar a IA
        id: budget
        if: success() && steps.gate.outputs.ready == 'true' && steps.gate.outputs.operation == 'process'
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANALYSIS_DAILY_RUN_LIMIT: ${{ vars.ANALYSIS_DAILY_RUN_LIMIT || '2' }}
        run: node scripts/analysis/reserve-budget.ts
      - name: Reservar créditos da conta que abriu o pedido
        if: success() && steps.budget.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_SEARCH_ENABLED: ${{ vars.GEMINI_SEARCH_ENABLED || 'false' }}
          ANALYSIS_PUBLIC_SOURCES_ENABLED: ${{ vars.ANALYSIS_PUBLIC_SOURCES_ENABLED || 'true' }}
          ANALYSIS_BATCH_SIZE: ${{ vars.ANALYSIS_BATCH_SIZE || '8' }}
          ANALYSIS_MAX_CALLS: ${{ vars.ANALYSIS_MAX_CALLS || '20' }}
          ANALYSIS_INTERVAL_SECONDS: ${{ vars.ANALYSIS_INTERVAL_SECONDS || '15' }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$GEMINI_MODEL" ]; then
            echo 'Configure GEMINI_API_KEY e GEMINI_MODEL antes de debitar créditos.'
            exit 1
          fi
          node scripts/analysis/execute.ts charge-credits
      - name: Processar próximo lote
        id: process
        if: success() && steps.budget.outputs.allowed == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_SEARCH_ENABLED: ${{ vars.GEMINI_SEARCH_ENABLED || 'false' }}
          ANALYSIS_PUBLIC_SOURCES_ENABLED: ${{ vars.ANALYSIS_PUBLIC_SOURCES_ENABLED || 'true' }}
          ANALYSIS_BATCH_SIZE: ${{ vars.ANALYSIS_BATCH_SIZE || '8' }}
          ANALYSIS_MAX_CALLS: ${{ vars.ANALYSIS_MAX_CALLS || '20' }}
          ANALYSIS_INTERVAL_SECONDS: ${{ vars.ANALYSIS_INTERVAL_SECONDS || '15' }}
        run: node scripts/analysis/execute.ts run
      - name: Preparar relatório revisado para publicação
        id: promote
        if: steps.gate.outputs.operation == 'publish-reviewed'
        env:
          VIDEO_ID: ${{ steps.prepare.outputs.video_id }}
        run: npm run analysis:promote -- "$VIDEO_ID" --reviewed
      - name: Validar relatório e aplicação
        id: checks
        if: steps.gate.outputs.operation == 'publish-reviewed'
        run: |
          npm test
          npm run lint
          npm run build
      - name: Registrar estado da execução sem expor dados de erro do provedor
        id: status
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          OPERATION: ${{ steps.gate.outputs.operation }}
          PROCESS_OUTCOME: ${{ steps.process.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          TRANSCRIPT_OUTCOME: ${{ steps.transcript.outcome }}
        run: node scripts/analysis/record-status.ts
      - name: Preservar checkpoint e abrir PR de revisão
        if: always() && steps.status.outputs.video_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          VIDEO_ID: ${{ steps.status.outputs.video_id }}
          OPERATION: ${{ steps.gate.outputs.operation }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
        run: |
          if [ ! -f "drafts/${VIDEO_ID}/status.json" ]; then exit 0; fi
          branch="analysis/issue-${ISSUE_NUMBER}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "drafts/${VIDEO_ID}"
          if [ "$OPERATION" = 'publish-reviewed' ] && [ "$CHECKS_OUTCOME" = 'success' ]; then
            git add -- "snapshots/${VIDEO_ID}.md" "transcripts/${VIDEO_ID}.md" public/snapshots/index.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "feat: atualizar análise da issue #${ISSUE_NUMBER}"
            git push --force-with-lease origin "HEAD:refs/heads/${branch}"
          fi
          if [ ! -f "drafts/${VIDEO_ID}/state.json" ]; then exit 0; fi
          node scripts/analysis/pr-body.ts
          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file .analysis-work/pr-body.md
          else
            gh pr create --draft --head "$branch" --title "feat: preparar análise #${ISSUE_NUMBER}" --body-file .analysis-work/pr-body.md
          fi
      - name: Preservar arquivos de diagnóstico
        if: always() && steps.status.outputs.video_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: analise-${{ steps.status.outputs.video_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: drafts/${{ steps.status.outputs.video_id }}/
          if-no-files-found: ignore
          retention-days: 7
      - name: Sinalizar interrupção do lote
        if: steps.process.outcome == 'failure'
        run: |
          echo 'Lote interrompido. O checkpoint disponível foi preservado; confira o motivo nos logs antes de retomar.'
          exit 1
